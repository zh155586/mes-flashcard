<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="app-icon.svg">
<meta name="apple-touch-fullscreen" content="yes">
<title>MES 英语闪卡大全</title>
<style>
  :root {
    --bg: #f0f2f5;
    --card-bg: #fff;
    --text: #1a1a2e;
    --text2: #555;
    --primary: #4361ee;
    --primary-light: #eef0ff;
    --success: #2ec4b6;
    --danger: #e71d36;
    --warning: #ff9f1c;
    --border: #e0e0e0;
    --shadow: 0 8px 30px rgba(0,0,0,0.12);
    --radius: 20px;
    --tag-bg: #f0f0f5;
    --progress-bg: #e0e0e0;
    --flip-speed: 0.6s;
  }
  .dark {
    --bg: #0f0f23;
    --card-bg: #1a1a3e;
    --text: #e0e0ff;
    --text2: #a0a0cc;
    --primary: #6c7bff;
    --primary-light: #1a1a4e;
    --border: #2a2a5e;
    --shadow: 0 8px 30px rgba(0,0,0,0.4);
    --tag-bg: #2a2a4e;
    --progress-bg: #2a2a4e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background .3s, color .3s;
  }
  .header {
    background: var(--card-bg);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
    flex-wrap: wrap;
    gap: 8px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary), var(--success));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all .2s;
    background: var(--tag-bg);
    color: var(--text);
  }
  .btn:hover { transform: translateY(-1px); opacity: .85; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 8px; }
  .btn-outline {
    background: transparent;
    border: 2px solid var(--primary);
    color: var(--primary);
  }
  .container { max-width: 800px; margin: 0 auto; padding: 20px 16px 40px; }

  /* Stats Bar */
  .stats-bar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .stat-item {
    flex: 1;
    min-width: 80px;
    background: var(--card-bg);
    border-radius: 14px;
    padding: 12px 16px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .stat-item .num { font-size: 24px; font-weight: 700; color: var(--primary); }
  .stat-item .label { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* Progress */
  .progress-wrap {
    background: var(--progress-bg);
    height: 8px;
    border-radius: 4px;
    margin: 12px 0 16px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--primary), var(--success));
    transition: width .5s ease;
    width: 0%;
  }

  /* Mode Buttons */
  .mode-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .mode-btn {
    padding: 7px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all .2s;
  }
  .mode-btn:hover { border-color: var(--primary); }
  .mode-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* Category Filter */
  .cat-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    max-height: 100px;
    overflow-y: auto;
    padding: 4px 0;
  }
  .cat-btn {
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text2);
    cursor: pointer;
    font-size: 12px;
    transition: all .2s;
    white-space: nowrap;
  }
  .cat-btn:hover { border-color: var(--primary); color: var(--primary); }
  .cat-btn.active {
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary);
  }

  /* Search */
  #searchBox {
    width: 100%;
    padding: 10px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
    margin-bottom: 12px;
    outline: none;
    transition: border-color .2s;
  }
  #searchBox:focus { border-color: var(--primary); }

  /* Flashcard */
  .flashcard-wrap {
    perspective: 1000px;
    margin-bottom: 16px;
  }
  .flashcard {
    width: 100%;
    min-height: 340px;
    position: relative;
    transition: transform var(--flip-speed);
    transform-style: preserve-3d;
    cursor: pointer;
  }
  .flashcard.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    min-height: 340px;
    backface-visibility: hidden;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .card-back {
    transform: rotateY(180deg);
  }
  .card-category {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .card-question {
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    margin: 20px 0 10px;
    line-height: 1.4;
  }
  .card-answer {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    color: var(--primary);
    margin: 20px 0 10px;
    line-height: 1.4;
  }
  .card-hint {
    text-align: center;
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 10px;
  }
  .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .card-detail {
    font-size: 14px;
    color: var(--text2);
    text-align: center;
    line-height: 1.6;
    margin: 8px 0;
    padding: 0 8px;
  }
  .card-example {
    font-size: 13px;
    color: var(--warning);
    text-align: center;
    margin-top: 6px;
    background: #fff8e6;
    padding: 8px 12px;
    border-radius: 8px;
    line-height: 1.5;
  }
  .dark .card-example { background: #2a2a1e; }
  .card-sam {
    font-size: 12px;
    color: var(--text2);
    text-align: center;
    margin-top: auto;
    padding-top: 12px;
  }

  /* Spelling Input */
  .spelling-input {
    width: 100%;
    max-width: 300px;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 18px;
    text-align: center;
    background: var(--card-bg);
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }
  .spelling-input:focus { border-color: var(--primary); }
  .spelling-input.correct { border-color: var(--success); background: #e8fff6; }
  .dark .spelling-input.correct { background: #1a3a2e; }
  .spelling-input.wrong { border-color: var(--danger); background: #ffe8e8; }
  .dark .spelling-input.wrong { background: #3a1a1a; }
  .feedback {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    min-height: 24px;
  }
  .feedback.correct { color: var(--success); }
  .feedback.wrong { color: var(--danger); }
  .reveal-word {
    font-size: 28px;
    font-weight: 700;
    color: var(--success);
    text-align: center;
    margin: 16px 0 6px;
  }

  /* Action Buttons */
  .action-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  /* Navigation */
  .nav-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .nav-btn {
    padding: 12px 28px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all .2s;
  }
  .nav-btn:hover { transform: translateY(-1px); opacity: .85; }
  .nav-prev { background: var(--tag-bg); color: var(--text); }
  .nav-next { background: var(--primary); color: #fff; }
  .nav-shuffle { background: var(--warning); color: #fff; }

  /* Table */
  .table-wrap { max-height: 500px; overflow-y: auto; background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); }
  .table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-wrap th { position: sticky; top: 0; background: var(--card-bg); border-bottom: 2px solid var(--border); padding: 10px 12px; text-align: left; z-index: 2; }
  .table-wrap td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .table-wrap tr:hover td { background: var(--primary-light); }
  .table-cat { display: inline-block; padding: 2px 8px; background: var(--tag-bg); border-radius: 10px; font-size: 11px; }

  /* Subcategories in card */
  .card-subcat {
    text-align: center;
    margin-bottom: 8px;
  }
  .card-subcat span {
    display: inline-block;
    padding: 2px 10px;
    background: var(--tag-bg);
    border-radius: 10px;
    font-size: 11px;
    color: var(--text2);
  }

  /* Count badge */
  .total-badge {
    font-size: 13px;
    color: var(--text2);
    padding: 4px 10px;
    background: var(--tag-bg);
    border-radius: 20px;
  }

  /* Search Panel */
  .search-bar {
    position: sticky;
    top: 57px;
    z-index: 99;
    background: var(--bg);
    padding: 8px 16px;
    display: none;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .search-bar.show { display: flex; }
  .search-bar input {
    flex: 1;
    padding: 10px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
    outline: none;
  }
  .search-bar input:focus { border-color: var(--primary); }
  .search-bar .close-btn {
    padding: 8px 14px;
    border: none;
    border-radius: 10px;
    background: var(--tag-bg);
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
  }
  .search-results {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 200;
    background: var(--bg);
    display: none;
    flex-direction: column;
    padding: 16px;
    overflow: hidden;
  }
  .search-results.show { display: flex; }
  .search-results .sr-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .search-results .sr-header input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid var(--primary);
    border-radius: 12px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
    outline: none;
  }
  .search-results .sr-header .close-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 10px;
    background: var(--danger);
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  .search-results .sr-count {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 8px;
  }
  .search-results .sr-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .search-results .sr-item {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background .2s;
  }
  .search-results .sr-item:active { background: var(--primary-light); }
  .search-results .sr-item .sr-en { font-size: 15px; font-weight: 600; color: var(--primary); }
  .search-results .sr-item .sr-cn { font-size: 14px; margin-top: 2px; }
  .search-results .sr-item .sr-cat { font-size: 11px; color: var(--text2); margin-top: 4px; display: inline-block; padding: 1px 8px; background: var(--tag-bg); border-radius: 8px; }
  .search-results .sr-item .sr-detail { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .search-results .sr-empty {
    text-align: center;
    padding: 40px;
    color: var(--text2);
    font-size: 15px;
  }
  .search-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.3); z-index: 199; }
  .search-overlay.show { display: block; }

  @media (max-width: 600px) {
    .header h1 { font-size: 16px; }
    .card-question { font-size: 20px; }
    .card-answer { font-size: 18px; }
    .flashcard { min-height: 280px; }
    .card-face { min-height: 280px; padding: 20px 16px; }
    .stat-item .num { font-size: 18px; }
    .mode-btn { font-size: 12px; padding: 5px 10px; }
    .cat-bar { max-height: 80px; }
    .nav-btn { padding: 10px 20px; font-size: 13px; }
    .btn { font-size: 12px; padding: 6px 12px; }
    .header { padding: 12px 16px; }
    .container { padding: 12px 10px 40px; }
    .stats-bar { gap: 6px; }
    .stat-item { padding: 8px 10px; min-width: 60px; }
  }
  /* Remove tap highlight on mobile */
  * { -webkit-tap-highlight-color: transparent; }
  button, .cat-btn, .nav-btn { touch-action: manipulation; }
</style>
</head>
<body>

<div class="header">
  <h1>📚 MES 英语闪卡大全</h1>
  <div class="header-actions">
    <button class="btn btn-sm" onclick="toggleDark()">🌓</button>
    <button class="btn btn-sm" onclick="openSearch()" style="background:var(--primary);color:#fff;">🔍</button>
    <span class="total-badge" id="totalBadge">0 词</span>
  </div>
</div>

<div class="container">

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item"><div class="num" id="totalCount">0</div><div class="label">总词汇</div></div>
    <div class="stat-item"><div class="num" id="learnedCount">0</div><div class="label">已掌握</div></div>
    <div class="stat-item"><div class="num" id="progressPct">0%</div><div class="label">进度</div></div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <!-- Mode Bar -->
  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('cn2en')">🇨🇳 看中文说英文</button>
    <button class="mode-btn" onclick="setMode('en2cn')">🇬🇧 看英文说中文</button>
    <button class="mode-btn" onclick="setMode('spell')">✏️ 拼写练习</button>
    <button class="mode-btn" onclick="setMode('description')">📖 看描述猜词</button>
    <button class="mode-btn" onclick="setMode('learn')">🔁 循环学习</button>
    <button class="mode-btn" onclick="setMode('table')">📋 词汇表</button>
  </div>

  <!-- Category Filter -->
  <div class="cat-bar" id="catFilter"></div>

  <!-- Search (table mode) -->
  <input id="searchBox" placeholder="🔍 搜索中文或英文..." style="display:none;">

  <!-- Content -->
  <div id="contentArea"></div>

  <!-- Navigation -->
  <div class="nav-bar" id="actionButtons">
    <button class="nav-btn nav-prev" onclick="prevCard()">◀ 上一张</button>
    <button class="nav-btn nav-shuffle" onclick="shuffleCards()">🔀 随机</button>
    <button class="nav-btn nav-next" onclick="nextCard()">下一张 ▶</button>
  </div>

  <!-- Actions -->
  <div class="action-bar" id="actionButtons2">
    <button class="btn btn-success btn-sm" onclick="markLearned(true)">✅ 已掌握 (1)</button>
    <button class="btn btn-outline btn-sm" onclick="markLearned(false)">🔄 再学一次 (2)</button>
  </div>

</div>

<script>
// ============== TERMS DATA ==============
const ALL_TERMS = [
  // === 一、订单与计划 ===
  {cn:"销售订单", en:"Sales Order (SO)", cat:"订单与计划", detail:"客户视角的订单，记录客户要什么款、颜色、数量、交期"},
  {cn:"制单", en:"MES Order (MO)", cat:"订单与计划", detail:"工厂视角的生产组织单元，一个SO可按颜色/货期拆成多个MO"},
  {cn:"工单", en:"Shop Order", cat:"订单与计划", detail:"车间视角的最小排产单元，一个MO按幅位拆成多个工单"},
  {cn:"三层订单体系", en:"Three-tier Order (SO→MO→Shop Order)", cat:"订单与计划", detail:"MES中1:N:N的订单分层体系：销售订单→制单→工单"},
  {cn:"套装", en:"Set / Suit", cat:"订单与计划", detail:"多件衣服搭配成套销售，如上衣+裤子+内衣"},
  {cn:"套装组件", en:"Component", cat:"订单与计划", detail:"套装中的单件组件，编号为C1、C2、C3等"},
  {cn:"拆分规则", en:"Splitting Rule", cat:"订单与计划", detail:"MO生成规则，决定一个SO按PO/颜色/货期等拆成多个MO"},
  {cn:"采购订单", en:"Purchase Order (PO)", cat:"订单与计划", detail:"客户下达的采购订单，是SO的上游单据"},
  {cn:"生产制单管理", en:"Production Order Management", cat:"订单与计划", detail:"管理MO的界面：确认/撤销/删除/关闭制单"},
  {cn:"订单确认", en:"Order Confirmation", cat:"订单与计划", detail:"确认制单，确认后MO进入可生产状态"},
  {cn:"订单下达", en:"Order Release", cat:"订单与计划", detail:"下达制单，系统生成工单和SFC"},
  {cn:"订单关闭", en:"Order Close", cat:"订单与计划", detail:"关闭已完成的生产制单"},
  {cn:"订单取消", en:"Order Cancellation", cat:"订单与计划", detail:"取消未完成的制单"},
  {cn:"排产", en:"Production Scheduling", cat:"订单与计划", detail:"根据产能和交期安排生产计划"},
  {cn:"产能计划", en:"Capacity Planning", cat:"订单与计划", detail:"评估工厂产能能否满足订单需求"},
  {cn:"交期", en:"Delivery Date / Due Date", cat:"订单与计划", detail:"客户要求的交货日期"},
  {cn:"计划开工日", en:"Planned Start Date", cat:"订单与计划", detail:"系统计划开始生产的日期"},
  {cn:"计划完工日", en:"Planned Completion Date", cat:"订单与计划", detail:"系统计划完成生产的日期"},
  {cn:"实际开工日", en:"Actual Start Date", cat:"订单与计划", detail:"实际开始生产的日期"},
  {cn:"实际完工日", en:"Actual Completion Date", cat:"订单与计划", detail:"实际完成生产的日期"},
  {cn:"订单优先级", en:"Order Priority", cat:"订单与计划", detail:"订单的优先级排序，影响排产顺序"},
  {cn:"订单状态", en:"Order Status", cat:"订单与计划", detail:"制单的当前状态：新建/确认/下达/进行中/完成/关闭"},
  {cn:"延期", en:"Delay / Postponement", cat:"订单与计划", detail:"订单交期延迟的情况"},
  {cn:"急单", en:"Rush Order", cat:"订单与计划", detail:"需要优先处理的紧急订单"},
  {cn:"订单数量", en:"Order Quantity", cat:"订单与计划", detail:"制单的总生产数量"},
  {cn:"已产数量", en:"Produced Quantity", cat:"订单与计划", detail:"当前已完成的生产数量"},
  {cn:"剩余数量", en:"Balance Quantity", cat:"订单与计划", detail:"尚未生产的剩余数量"},
  {cn:"物料清单", en:"BOM (Bill of Materials)", cat:"订单与计划", detail:"产品所需的物料清单，包括面料和辅料明细"},

let currentMode = 'cn2en';
let currentCat = '全部';
let filteredTerms = [...ALL_TERMS];
let currentIndex = 0;
let isFlipped = false;
let learned = JSON.parse(localStorage.getItem('mes_learned_ult') || '{}');
let spellingAnswer = '';

// ============== CATEGORIES ==============
function getCategories() {
  const cats = ['全部', ...new Set(ALL_TERMS.map(t => t.cat))];
  // Preserve desired category order
  const order = ['全部','订单与计划','工艺路线','服装面料','辅料','服装部位','拉布裁剪','车缝','洗水','烧菲发卡','品质管理','验针','后整包装','外发管理','设备管理','考勤与效率','产前','STI无缝针织','船务物流','终端与系统','常见动词','角色部门','状态描述','场景对话','系统缩写'];
  return order.filter(c => cats.includes(c)).concat(cats.filter(c => !order.includes(c)));
}

// ============== RENDER CAT FILTER ==============
function renderCatFilter() {
  const el = document.getElementById('catFilter');
  const cats = getCategories();
  el.innerHTML = cats.map(c =>
    `<button class="cat-btn ${c === currentCat ? 'active' : ''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`
  ).join('');
}

// ============== SET CATEGORY ==============
function setCat(cat) {
  currentCat = cat;
  if (cat === '全部') filteredTerms = [...ALL_TERMS];
  else filteredTerms = ALL_TERMS.filter(t => t.cat === cat);
  renderCatFilter();
  currentIndex = 0;
  isFlipped = false;
  renderCurrentCard();
  updateStats();
}

// ============== SHUFFLE ==============
function shuffleCards() {
  for (let i = filteredTerms.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredTerms[i], filteredTerms[j]] = [filteredTerms[j], filteredTerms[i]];
  }
  currentIndex = 0;
  isFlipped = false;
  renderCurrentCard();
}

// ============== SET MODE ==============
function setMode(mode) {
  currentMode = mode;
  isFlipped = false;
  document.querySelectorAll('.mode-btn').forEach(b => {
    const labels = {cn2en:'看中文',en2cn:'看英文',spell:'拼写',description:'看描述',learn:'循环学习',table:'词汇表'};
    b.classList.toggle('active', b.textContent.includes(labels[mode]));
  });
  document.getElementById('searchBox').style.display = mode === 'table' ? 'block' : 'none';
  const nav = document.getElementById('actionButtons');
  const act = document.getElementById('actionButtons2');
  nav.style.display = (mode === 'table') ? 'none' : 'flex';
  act.style.display = (mode === 'table') ? 'none' : 'flex';
  currentIndex = 0;
  renderCurrentCard();
}

// ============== STATS ==============
function updateStats() {
  const total = filteredTerms.length;
  const totalAll = ALL_TERMS.length;
  const learnedCount = filteredTerms.filter(t => learned[t.cn]).length;
  const learnedAll = ALL_TERMS.filter(t => learned[t.cn]).length;
  const pct = totalAll > 0 ? Math.round(learnedAll / totalAll * 100) : 0;
  document.getElementById('totalCount').textContent = totalAll;
  document.getElementById('learnedCount').textContent = learnedAll;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('totalBadge').textContent = totalAll + ' 词';
}

// ============== RENDER CARD ==============
function renderCurrentCard() {
  if (filteredTerms.length === 0) {
    document.getElementById('contentArea').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text2)"><div style="font-size:48px;margin-bottom:16px;">🎉</div><h3>没有词汇</h3><p>当前分类没有词汇，试试其他分类吧！</p></div>';
    return;
  }
  if (currentIndex >= filteredTerms.length) currentIndex = 0;
  if (currentIndex < 0) currentIndex = 0;

  if (currentMode === 'table') { renderTable(); return; }

  const term = filteredTerms[currentIndex];
  const isLearned = learned[term.cn];

  // === FRONT FACE ===
  let frontHtml = '<div class="card-face card-front">';
  frontHtml += '<div class="card-category"><span>📂 ' + term.cat + '</span><span>' + (currentIndex + 1) + '/' + filteredTerms.length + '</span></div>';

  if (currentMode === 'cn2en') {
    frontHtml += '<div class="card-question">' + term.cn + '</div>';
    frontHtml += '<div class="card-hint">👆 点击翻转 · 看中文说英文</div>';
    frontHtml += '<div class="card-body"><div style="font-size:40px;">🤔</div></div>';
  } else if (currentMode === 'en2cn') {
    frontHtml += '<div class="card-question" style="font-size:22px;">' + term.en + '</div>';
    frontHtml += '<div class="card-hint">👆 点击翻转 · 看英文说中文</div>';
    frontHtml += '<div class="card-body"><div style="font-size:40px;">🤔</div></div>';
  } else if (currentMode === 'description') {
    frontHtml += '<div class="card-hint">👆 点击翻转 · 看描述说出术语</div>';
    frontHtml += '<div class="card-question" style="font-size:18px;font-weight:500;">' + term.detail + '</div>';
    frontHtml += '<div class="card-body"><div style="font-size:40px;">🤔</div></div>';
  } else if (currentMode === 'spell') {
    frontHtml += '<div class="card-question">' + term.cn + '</div>';
    frontHtml += '<div class="card-hint">输入英文拼写，按回车核对</div>';
    frontHtml += '<div class="card-body"><input class="spelling-input" id="spellInput" placeholder="输入英文..." autocomplete="off" onkeydown="if(event.key==\'Enter\')checkSpell()" onclick="event.stopPropagation()"><div class="feedback" id="spellFeedback"></div></div>';
  } else if (currentMode === 'learn') {
    // Learning mode: show full content without flip
    frontHtml += '<div class="card-question" style="font-size:22px;">' + term.en + '</div>';
    frontHtml += '<div class="card-answer" style="font-size:20px;margin-top:0;">' + term.cn + '</div>';
    frontHtml += '<div class="card-detail">' + term.detail + '</div>';
    frontHtml += '<div class="card-hint" style="margin-top:10px;">👆 点击可翻转对照</div>';
  }

  if (isLearned) frontHtml += '<div class="card-sam">✅ 已掌握</div>';
  frontHtml += '</div>';

  // === BACK FACE ===
  let backHtml = '<div class="card-face card-back">';
  backHtml += '<div class="card-category"><span>📂 ' + term.cat + '</span><span>' + (currentIndex + 1) + '/' + filteredTerms.length + '</span></div>';

  if (currentMode === 'cn2en') {
    backHtml += '<div class="card-answer" style="font-size:22px;">' + term.en + '</div>';
    backHtml += '<div class="card-detail">' + term.detail + '</div>';
  } else if (currentMode === 'en2cn') {
    backHtml += '<div class="card-answer">' + term.cn + '</div>';
    backHtml += '<div class="card-detail">' + term.detail + '</div>';
  } else if (currentMode === 'description') {
    backHtml += '<div class="card-answer" style="font-size:20px;">' + term.en + '</div>';
    backHtml += '<div class="card-detail">中文：' + term.cn + '</div>';
    backHtml += '<div class="card-example">💡 ' + term.detail + '</div>';
  } else if (currentMode === 'spell') {
    backHtml += '<div class="reveal-word">' + term.en.split(' (')[0] + '</div>';
    backHtml += '<div class="card-answer" style="font-size:18px;margin-top:6px;">中文：' + term.cn + '</div>';
    backHtml += '<div class="card-detail">' + term.detail + '</div>';
  } else if (currentMode === 'learn') {
    backHtml += '<div class="card-question" style="font-size:22px;">' + term.cn + '</div>';
    backHtml += '<div class="card-answer" style="font-size:20px;margin-top:0;">' + term.en + '</div>';
    backHtml += '<div class="card-detail">' + term.detail + '</div>';
  }

  backHtml += '<div class="card-sam">👆 点击翻回 · ' + (isLearned ? '✅ 已掌握' : '⬜ 学习中') + '</div>';
  backHtml += '</div>';

  let html = '<div class="flashcard-wrap"><div class="flashcard' + (isFlipped ? ' flipped' : '') + '" onclick="toggleFlip()">'
    + frontHtml + backHtml + '</div></div>';

  document.getElementById('contentArea').innerHTML = html;

  if (currentMode === 'spell' && !isFlipped) {
    const inp = document.getElementById('spellInput');
    if (inp) { inp.focus(); spellingAnswer = term.en.split(' (')[0].toLowerCase(); }
  }

  updateStats();
}

// ============== FLIP ==============
function toggleFlip() {
  if (currentMode === 'spell' && !isFlipped) {
    if (document.getElementById('spellInput') && document.activeElement === document.getElementById('spellInput')) return;
  }
  if (currentMode === 'table') return;
  if (currentMode === 'learn') {
    // In learn mode flipping shows reverse side
    isFlipped = !isFlipped;
    renderCurrentCard();
    return;
  }
  isFlipped = !isFlipped;
  renderCurrentCard();
}

// ============== SPELLING CHECK ==============
function checkSpell() {
  const inp = document.getElementById('spellInput');
  const fb = document.getElementById('spellFeedback');
  if (!inp || !fb) return;
  const answer = inp.value.trim().toLowerCase();
  if (!answer) return;

  if (answer === spellingAnswer ||
      answer.replace(/[^a-z0-9]/g,'') === spellingAnswer.replace(/[^a-z0-9]/g,'')) {
    inp.className = 'spelling-input correct';
    fb.className = 'feedback correct';
    fb.textContent = '✅ 拼写正确！';
    setTimeout(() => { markLearned(true); }, 800);
  } else {
    inp.className = 'spelling-input wrong';
    fb.className = 'feedback wrong';
    fb.textContent = '❌ 不对，再想想！（点击卡片可看答案）';
  }
}

// ============== MARK LEARNED ==============
function markLearned(yes) {
  if (filteredTerms.length === 0) return;
  const term = filteredTerms[currentIndex];
  if (yes) learned[term.cn] = true;
  else delete learned[term.cn];
  localStorage.setItem('mes_learned_ult', JSON.stringify(learned));
  isFlipped = false;
  nextCard();
}

// ============== NAVIGATION ==============
function nextCard() {
  if (currentIndex < filteredTerms.length - 1) currentIndex++;
  else currentIndex = 0;
  isFlipped = false;
  renderCurrentCard();
}
function prevCard() {
  if (currentIndex > 0) currentIndex--;
  else currentIndex = filteredTerms.length - 1;
  isFlipped = false;
  renderCurrentCard();
}

// ============== TABLE MODE ==============
function renderTable() {
  if (currentMode !== 'table') return;
  const q = document.getElementById('searchBox').value.toLowerCase();
  let terms = filteredTerms;
  if (q) terms = terms.filter(t => t.cn.includes(q) || t.en.toLowerCase().includes(q) || t.cat.includes(q));

  let html = '<div class="table-wrap"><table>';
  html += '<tr><th>中文</th><th>English</th><th>分类</th><th>状态</th></tr>';
  terms.forEach(t => {
    const l = learned[t.cn] ? '✅' : '⬜';
    html += `<tr><td><strong>${t.cn}</strong></td><td>${t.en}</td><td><span class="table-cat">${t.cat}</span></td><td style="text-align:center">${l}</td></tr>`;
  });
  html += '</table></div>';
  if (terms.length === 0) html = '<div style="text-align:center;padding:40px;color:var(--text2)">没有匹配的词汇</div>';
  document.getElementById('contentArea').innerHTML = html;
}

// ============== TOGGLE DARK ==============
function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('mes_dark_ult', document.body.classList.contains('dark') ? '1' : '0');
}

// ============== TOUCH SWIPE ==============
let touchStartX = 0;
let touchStartY = 0;
let touchEndX = 0;
let touchEndY = 0;
let isSwiping = false;

document.addEventListener('touchstart', (e) => {
  if (currentMode === 'table') return;
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  isSwiping = false;
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (currentMode === 'table') return;
  const t = e.touches[0];
  const dx = Math.abs(t.clientX - touchStartX);
  const dy = Math.abs(t.clientY - touchStartY);
  if (dx > 10 || dy > 10) isSwiping = true;
  // Add visual feedback - slight card shift
  const card = document.querySelector('.flashcard');
  if (card && !isFlipped && currentMode !== 'spell') {
    const offset = t.clientX - touchStartX;
    if (Math.abs(offset) < 100) {
      card.style.transform = `rotateY(${isFlipped ? 180 : 0}deg) translateX(${offset * 0.2}px)`;
    }
  }
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (currentMode === 'table') { isSwiping = false; return; }
  if (!isSwiping) return; // Was a tap, not a swipe
  const t = e.changedTouches[0];
  touchEndX = t.clientX;
  touchEndY = t.clientY;
  const dx = touchEndX - touchStartX;
  const dy = Math.abs(touchEndY - touchStartY);

  // Reset card transform
  const card = document.querySelector('.flashcard');
  if (card) {
    card.style.transform = '';
    card.style.transition = 'none';
    setTimeout(() => { if (card) card.style.transition = ''; }, 50);
  }

  // Only horizontal swipes (not vertical scrolling)
  if (Math.abs(dx) > 60 && dy < Math.abs(dx)) {
    if (dx > 0) prevCard();
    else nextCard();
  }
  isSwiping = false;
}, { passive: true });

// ============== SEARCH ALL TERMS ==============
let searchTimeout = null;

function openSearch() {
  document.getElementById('searchOverlay').classList.add('show');
  document.getElementById('searchPanel').classList.add('show');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchList').innerHTML = '';
  document.getElementById('searchCount').textContent = '';
  setTimeout(() => document.getElementById('searchInput').focus(), 200);
}

function closeSearch() {
  document.getElementById('searchOverlay').classList.remove('show');
  document.getElementById('searchPanel').classList.remove('show');
}

function searchAll() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = document.getElementById('searchList');
  const count = document.getElementById('searchCount');

  if (!q) {
    list.innerHTML = '<div class="sr-empty">🔍 输入中文/英文/分类名称开始搜索全部616个词汇</div>';
    count.textContent = '';
    return;
  }

  // Search ALL terms, not just filtered
  const results = ALL_TERMS.filter(t =>
    t.cn.toLowerCase().includes(q) ||
    t.en.toLowerCase().includes(q) ||
    t.cat.toLowerCase().includes(q) ||
    (t.detail && t.detail.toLowerCase().includes(q))
  );

  count.textContent = results.length > 0
    ? `找到 ${results.length} 个匹配结果`
    : '没有匹配的词汇';

  if (results.length === 0) {
    list.innerHTML = '<div class="sr-empty">😕 没有找到，试试其他关键词</div>';
    return;
  }

  list.innerHTML = results.map(t =>
    `<div class="sr-item" onclick="goToTerm('${t.cn.replace(/'/g,"\\'")}')">
      <div class="sr-en">${highlight(t.en, q)}</div>
      <div class="sr-cn">${highlight(t.cn, q)}</div>
      <span class="sr-cat">${t.cat}</span>
      <div class="sr-detail">${highlight(t.detail, q)}</div>
    </div>`
  ).join('');
}

function highlight(text, query) {
  if (!query) return text;
  const idx = text.toLowerCase().indexOf(query);
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark style="background:#ffd700;color:#1a1a2e;border-radius:2px;padding:0 2px;">' +
    text.slice(idx, idx + query.length) + '</mark>' +
    text.slice(idx + query.length);
}

function goToTerm(cn) {
  const idx = ALL_TERMS.findIndex(t => t.cn === cn);
  if (idx === -1) return;
  // Set filtered to all, go to that term
  currentCat = '全部';
  filteredTerms = [...ALL_TERMS];
  renderCatFilter();
  currentIndex = idx;
  isFlipped = false;
  renderCurrentCard();
  closeSearch();
  updateStats();
}

// ============== KEYBOARD SHORTCUTS ==============
document.addEventListener('keydown', (e) => {
  if (currentMode === 'table') return;
  if (e.key === ' ' || e.key === 'Enter') {
    if (currentMode === 'spell' && !isFlipped) return;
    e.preventDefault();
    if (!isFlipped) toggleFlip();
    else nextCard();
  }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextCard(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevCard(); }
  if (e.key === '1') markLearned(true);
  if (e.key === '2') markLearned(false);
});

// ============== INIT ==============
function init() {
  if (localStorage.getItem('mes_dark_ult') === '1') document.body.classList.add('dark');
  renderCatFilter();
  filteredTerms = [...ALL_TERMS];
  updateStats();
  renderCurrentCard();

  // Register service worker for offline PWA use
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

init();
</script>

<!-- Search Modal -->
<div class="search-overlay" id="searchOverlay" onclick="closeSearch()"></div>
<div class="search-results" id="searchPanel">
  <div class="sr-header">
    <input id="searchInput" placeholder="🔍 搜索中文 / English / 分类…" autocomplete="off" oninput="searchAll()" onkeydown="if(event.key==='Enter')searchAll()">
    <button class="close-btn" onclick="closeSearch()">✕</button>
  </div>
  <div class="sr-count" id="searchCount"></div>
  <div class="sr-list" id="searchList"></div>
</div>

</body>
